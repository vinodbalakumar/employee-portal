info.app.name=Tesla Dashboard Services
info.app.description=Tesla dashboard backend services
info.app.version=1.0.0
info.company.name=Tesla Dashboard Services

server.address=0.0.0.0
server.port=8081
spring.application.name=tesla-dashboard-services
server.servlet.context-path= /tesla-dashboard-services


# JPA Configuration


spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tesla}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0



# Keep Hibernate SQL out of normal runtime logs. Enable org.hibernate.SQL below only when debugging DB queries.
spring.jpa.show-sql=false

# Format SQL queries for better readability
spring.jpa.properties.hibernate.format_sql=true

# Enable logging of SQL parameters
spring.jpa.properties.hibernate.use_sql_comments=false

# Optional: Log the executed SQL to a specific log level
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicTypeDescriptor=TRACE
logging.level.com.java.vinod.tesla.dashboard.services=INFO
logging.level.org.springframework.security=INFO

app.jwt.public-key-base64=${JWT_PUBLIC_KEY_BASE64:}
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:c:/Users/HP/projects/certs/jwt-public.pem}
app.jwt.audiences=${JWT_AUDIENCES:${JWT_AUDIENCE:auth-clients}}

tesla.fleet-api-base=${TESLA_FLEET_API_BASE:https://fleet-api.prd.na.vn.cloud.tesla.com}
tesla.proxy-base=${TESLA_PROXY_BASE:https://127.0.0.1:4443}
tesla.auth-token-url=${TESLA_AUTH_TOKEN_URL:https://auth.tesla.com/oauth2/v3/token}
tesla.vehicle-id-or-vin=${TESLA_VEHICLE_ID_OR_VIN:}
tesla.default-token-id=${TESLA_DEFAULT_TOKEN_ID:1}
tesla.token-refresh-skew-minutes=${TESLA_TOKEN_REFRESH_SKEW_MINUTES:2}
