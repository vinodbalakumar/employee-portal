services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: tesla-dashboard-services:latest
    container_name: tesla-dashboard-services
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_NAME: tesla
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?Set JWT_PUBLIC_KEY_BASE64 to the authorization-server public key PEM encoded as base64}
      JWT_AUDIENCES: auth-clients
    ports:
      - "8081:8081"
